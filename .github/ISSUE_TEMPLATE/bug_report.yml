name: Bug report
description: Report an incorrect, inconsistent, or unsafe project behavior.
title: "[Bug]: "
labels: ["bug", "triage"]
body:
  - type: markdown
    attributes:
      value: |
        Do not include credentials, personal data, real infrastructure, exploit payloads, or private operational evidence. Use private vulnerability reporting for sensitive security issues.
  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - Documentation or navigation
        - Governance or claims
        - Syntax or grammar
        - Schema or canonicalization
        - Acceptance fixture or traceability
        - Verification tooling or CI
        - Security boundary
        - Upstream compatibility
    validations:
      required: true
  - type: textarea
    id: observed
    attributes:
      label: Observed behavior
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: evidence
    attributes:
      label: Synthetic reproduction and evidence
      description: Use synthetic, public-safe inputs only.
    validations:
      required: true
  - type: checkboxes
    id: boundary
    attributes:
      label: Boundary confirmation
      options:
        - label: I removed credentials, personal data, and real infrastructure details.
          required: true
        - label: This report does not ask the project to execute a command or access live state.
          required: true
